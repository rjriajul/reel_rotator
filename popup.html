<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 230px; margin: 12px; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  td { padding: 3px 6px 3px 0; }
  kbd { background: #eee; border: 1px solid #ccc; border-radius: 4px; padding: 1px 5px; }
</style>
<h1>Reel Rotator</h1>
<table>
  <tr><td><kbd>R</kbd></td><td>Turn left</td></tr>
  <tr><td><kbd>Shift</kbd>+<kbd>R</kbd></td><td>Turn right</td></tr>
  <tr><td><kbd>F</kbd></td><td>Mirror</td></tr>
  <tr><td><kbd>Z</kbd></td><td>Zoom sideways video to fill</td></tr>
  <tr><td><kbd>0</kbd></td><td>Reset</td></tr>
</table>
<p>Or use the round arrow button on Instagram:<br>click = left, right-click = right, double-click = reset.</p>
